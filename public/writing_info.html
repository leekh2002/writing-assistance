<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width" , initial-scale="1" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/writing_info.js" defer></script>
  </head>
  <body>

    <!-- 헤더 부분 -->
    <header class="header">
      <!-- 문제 제목 표시 -->
      <div class="title"></div>
    </header>

    <!-- 본문 내용 -->
    <div class="content">

      <!-- 글쓰기 가이드 설명 부분 -->
      <div class="col-lg-6 guide-section">
      </div>

      <!-- 글 목록 및 작성된 글 정보 섹션 -->
      <div class="col-lg-6 section2">
        <!-- 글 목록 선택 부분 -->
        <div class="select-section">
          <label for="writing-list">글 목록</label>
          <select name="writing-list" id="writing-list">
            <!-- 작성된 글 목록을 동적으로 삽입할 수 있도록 선택 태그 사용 -->
          </select>
        </div>

        <!-- 작성된 글 정보 섹션 -->
        <div class="writing-info-section">
          <h2 style="font-weight: bold">작성한 글</h2>
        </div>

        <!-- 피드백 섹션 -->
        <div class="feedback-section">
          <h2 style="font-weight: bold">피드백</h2>

          <!-- 피드백 점수 -->
          <div class="feedback-score">
            <h3>종합 점수: 85/100</h3>
          </div>

          <!-- 피드백 내용 -->
          <div class="feedback-content">
            <h3>내용</h3>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
