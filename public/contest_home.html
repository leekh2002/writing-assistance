<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>contest_home</title>
    <style>
      /* body 스타일 설정 */
      body {
        height: 100vh; /* 화면 전체 높이를 차지하도록 설정 */
        background-image: url('./images/background.png'); /* 배경 이미지 설정 */
        background-size: cover; /* 배경 이미지를 화면에 맞게 크기 조정 */
        background-repeat: no-repeat; /* 배경 이미지 반복 방지 */
        background-position: center; /* 배경 이미지 위치 중앙으로 설정 */
        font-family: 'Arial', sans-serif; /* 글꼴 설정 */
        background-color: #f4f4f4; /* 배경 색상 설정 */
        margin: 0; /* 기본 여백 제거 */
        padding: 20px; /* 본문에 여백 추가 */
        color: #333; /* 글자 색 설정 */
      }

      /* h1 스타일 설정 */
      h1 {
        text-align: center; /* 제목을 중앙 정렬 */
        color: #4caf50; /* 제목 색상 설정 */
      }
    </style>
    <!-- 외부 스타일시트와 자바스크립트 파일 링크 -->
    <link rel="stylesheet" href="styles.css" />
    <script src="./js/contest_home.js" defer></script>
  </head>
  <body>
    <div class="container">
      <!-- 대회 제목 -->
      <h1>제 1회 글쓰기 콘테스트</h1>
      <div class="my-contestinfo-section">
        <!-- 내 점수 섹션 -->
        <div class="my-score-section">
          <h2>내 점수</h2>
          <div>
            <span>-/100</span>
            <!-- 점수를 표시할 부분 -->
          </div>
        </div>

        <!-- 제출 시간 섹션 -->
        <div class="my-submittime-section">
          <h2>제출 시간</h2>
          <div>
            <span>-:-:-</span>
            <!-- 제출 시간을 표시할 부분 -->
          </div>
        </div>

        <!-- 순위 섹션 -->
        <div class="my-ranking-section">
          <h2>순위</h2>
          <div>
            <span>-위</span>
            <!-- 순위를 표시할 부분 -->
          </div>
        </div>
      </div>

      <!-- 참가하기 버튼 -->
      <button class="join-contest-btn">참가하기</button>

      <!-- 스코어보드 섹션 -->
      <div class="scoreboard-section">
        <h2>스코어보드</h2>
        <!-- 대회 라운드 선택을 위한 select box -->
        <select name="contest-round" id="contest-round"></select>

        <!-- 스코어보드를 위한 테이블 -->
        <table class="scoreboard">
          <thead>
            <tr>
              <th>순위</th>
              <th>유저</th>
              <th>점수</th>
              <th>제출 시간</th>
            </tr>
          </thead>
          <tbody></tbody>
          <!-- 스코어보드 내용이 동적으로 추가될 부분 -->
        </table>
      </div>
    </div>
  </body>
</html>
