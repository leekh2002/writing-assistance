<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width" , initial-scale="1" />
    <link rel="stylesheet" href="css/bootstrap.css" />
    <link rel="stylesheet" href="css/suneditor.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <script src="./js/writing.js" defer></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- SunEdtor js -->
    <script type="text/javascript" src="js/suneditor.min.js"></script>
    <script type="text/javascript" src="js/jquery-3.0.0.min.js"></script>
    <script type="text/javascript">
      $(function () {
        // SunEditor 인스턴스 생성
        SUNEDITOR.create('content', {
          font: ['Arial', 'tahoma', 'Courier New,Courier'], //글꼴 설정
          fontSize: [8, 10, 14, 18, 24, 36],  //글꼴 크기 설정
          colorList: [  //글자색 설정
            [
              '#ccc',
              '#dedede',
              'OrangeRed',
              'Orange',
              'RoyalBlue',
              'SaddleBrown',
            ],
            [
              'SlateGray',
              'BurlyWood',
              'DeepPink',
              'FireBrick',
              'Gold',
              'SeaGreen',
            ],
          ],
          width: '100%',  //편집기 너비 설정
          maxWidth: '600px',  //편집기 최대 너비
          minWidth: 400,  //편집기 최소 너비
          height: 'auto', //편집기 높이 자동 설정
          imageWidth: 150,  //이미지의 기본 너비 설정
          popupDisplay: 'local',  //팝업 표시 방법 설정
          resizingBar: false, //크기 조정 바 비활성화
          buttonList: [ //편집기에서 사용할 버튼 설정
            [
              'font',
              'fontSize',
              'bold',
              'underline',
              'fontColor',
              'hiliteColor',
            ],
          ],
          callBackSave: function (contents) {
            alert(contents);
          },
        });
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <header class="header">
      <!-- 문제 제목 -->
      <div class="title">문제 제목: 철학적 사고의 이해</div>
    </header>

    <div class="content">

      <!-- 주제 내용 표시 영역 -->
      <div class="col-lg-6 guide-section">
      </div>

      <div class="col-lg-6 write-section">

        <!-- 글 목록 드롭다운 -->
        <label for="writing-list">글 목록</label>
        <select name="writing-list" id="writing-list">
          <!-- 글 목록 옵션은 자바스크립트로 동적으로 추가될 예정 -->
        </select>

        <!-- 글 목록 추가 버튼 -->
        <button class="writing-list-add">
          <img src="./images/add.png" alt="add" /><span>추가</span>
        </button>

        <!-- 글 작성용 텍스트 에디터 -->
        <textarea
          class="form-control"
          id="content"
          placeholder="글 내용"
          name="content"
          maxlength="2048"
          style="height: 600px"
        ></textarea>

        <!-- 제출 버튼 -->
        <button class="submit">제출</button>
      </div>
    </div>
  </body>
</html>
